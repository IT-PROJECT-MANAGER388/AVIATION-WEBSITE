<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <title>Contact</title>
    <link rel="stylesheet"type="text/css" href="contact.css" />
</head>

<body style="background-color: grey;">

    <form align="center" action="mailto:222728566@edu.vut.ac.za" method="POST" enctype="text/plain" >
        
        <h3>Contact</h3>

        <!-- USERNAME INPUT-->
        <p>
            <input type="text" class="username" name="name" placeholder="Your Name">
        </p>
        
        <!-- EMAIL INPUT -->
        <p>
            <input type="email" class="user_email" name="email" placeholder="Your Email">
        </p>
        
        <!-- TEXTAREA -->
        <p>
            <textarea class="text_area" name="message" placeholder="Your Message"></textarea>
        </p>

        <button type="submit">Send</button>

      </form>
      
</body>

</html>
